name: Minimal review synthetic tests
on:
  push:
    paths:
      - 'reviews/20261030-minimal/**'
      - '.github/workflows/minimal-review.yml'
  pull_request:
    paths:
      - 'reviews/20261030-minimal/**'
      - '.github/workflows/minimal-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify snapshot checksums
        working-directory: reviews/20261030-minimal
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path.cwd()
          for name, expected in json.loads(Path("SHA256.json").read_text()).items():
              path = (root / name).resolve()
              if not path.is_relative_to(root):
                  raise SystemExit("Manifest path escapes snapshot")
              if hashlib.sha256(path.read_bytes()).hexdigest() != expected:
                  raise SystemExit("Checksum mismatch: " + name)
          print("All snapshot checksums match")
          PY
      - name: Synthetic tests only — no deployment or exchange access
        working-directory: reviews/20261030-minimal
        run: python3 -m unittest discover -s tests -v
